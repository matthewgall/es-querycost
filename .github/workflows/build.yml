name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GOTOOLCHAIN: auto

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -cover ./...

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [test, integration]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            extension: .exe

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Download modules
        run: go mod download

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          output="dist/es-querycost-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.extension }}"
          go build -ldflags="-s -w" -o "$output" ./cmd/es-querycost

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: es-querycost-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/es-querycost-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.extension }}
          if-no-files-found: error

  integration:
    name: integration
    needs: test
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          ELASTIC_PASSWORD: changeme
          xpack.security.http.ssl.enabled: "false"
          xpack.security.enrollment.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        options: >-
          --health-cmd "curl -s -f -u elastic:changeme http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      ESQUERY_TEST_ELASTICSEARCH_URL: http://localhost:9200
      ESQUERY_TEST_ELASTICSEARCH_USERNAME: elastic
      ESQUERY_TEST_ELASTICSEARCH_PASSWORD: changeme
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Download modules
        run: go mod download

      - name: Integration tests
        run: go test -tags integration -race -v ./internal/integration
